<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Development Course</title>
  <!-- <link rel="stylesheet" href="styles.css"> -->
   <style>
    body {
  font-family: Arial, sans-serif;
  margin: 0;
  background-color: #f2f2f2;
  color: #333;
}

header {
  background-color: #0e76a8;
  color: white;
  padding: 40px 20px;
  text-align: center;
}

header h1 {
  margin-bottom: 10px;
}

.video-gallery {
  padding: 20px;
  max-width: 1200px;
  margin: auto;
}

.video-gallery h2 {
  text-align: center;
  margin-bottom: 20px;
}

.videos-container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.video-box {
  background-color: white;
  border-radius: 10px;
  overflow: hidden;
  width: 320px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  transition: transform 0.3s ease;
}

.video-box:hover {
  transform: scale(1.03);
}

.video-box iframe {
  width: 100%;
  height: 180px;
}

.video-box p {
  padding: 10px;
  margin: 0;
  font-weight: bold;
  text-align: center;
}

   </style>
</head>
<body>
  <header>
    <h1>Web Development Course</h1>
    <p>Learn how to build responsive and modern websites using HTML, CSS, JavaScript, and more. This course is perfect for beginners and intermediate developers looking to upskill.</p>
  </header>

  <section class="video-gallery">
    <h2>Course Videos</h2>
    <div class="videos-container">
      <div class="video-box">
        <iframe src="https://www.youtube.com/embed/3JluqTojuME" frameborder="0" allowfullscreen></iframe>
        <p>Introduction to HTML</p>
      </div>
      <div class="video-box">
        <iframe src="https://www.youtube.com/embed/yfoY53QXEnI" frameborder="0" allowfullscreen></iframe>
        <p>CSS Basics</p>
      </div>
      <div class="video-box">
        <iframe src="https://www.youtube.com/embed/hdI2bqOjy3c" frameborder="0" allowfullscreen></iframe>
        <p>JavaScript for Beginners</p>
      </div>
      <!-- Add more videos here -->
    </div>
  </section>

 
</body>
</html>
