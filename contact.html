<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: #fff;
      border-radius: 12px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .form-container h2 {
      color: #1d1d1f;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .form-container p {
      font-size: 14px;
      color: #555;
      margin-bottom: 30px;
    }

    form input {
      width: 100%;
      padding: 12px 40px 12px 42px;
      border: 1px solid #dcdcdc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      background-repeat: no-repeat;
      background-position: 14px center;
      background-color: #f9f9f9;
    }

    input::placeholder {
      color: #888;
    }

    input:first-of-type {
      background-image: url('https://img.icons8.com/ios-filled/20/user.png');
    }

    input:nth-of-type(2) {
      background-image: url('https://img.icons8.com/ios-filled/20/user.png');
    }

    input[type="email"] {
      background-image: url('https://img.icons8.com/ios-filled/20/email.png');
    }

    input[type="tel"] {
      background-image: url('https://img.icons8.com/ios-filled/20/phone.png');
    }

    button {
      width: 100%;
      background-color: #0c0c43;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #1a1a60;
    }

    small {
      display: block;
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 480px) {
      .form-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Contact Us</h2>
    <p>We will get back to you asap!</p>
    <form>
      <input type="text" placeholder="First Name" required />
      <input type="text" placeholder="Last Name" required />
      <input type="email" placeholder="Email" required />
      <input type="tel" placeholder="Phone" required />
      <button type="submit">Send</button>
    </form>
    <small>You may also call us at 333-33-33</small>
  </div>
</body>
</html>
